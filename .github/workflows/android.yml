name: Build Android APK

on:
  push:
    branches:
      - claude/travel-supplies-app-hqv0rv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          # 여기에 Firebase 시크릿을 등록하면 Google 저장이 켜진다. 없으면 기기 저장 모드.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/supplies-v${{ github.run_number }}-debug.apk

      # 1) 워크플로우 실행 화면에서 바로 내려받을 수 있는 아티팩트
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplies-apk
          path: out/supplies-v${{ github.run_number }}-debug.apk
          if-no-files-found: error

      # 2) 영구 다운로드 링크 + 새 릴리스 알림 (빌드마다 새 릴리스)
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: 준비물 안드로이드 v${{ github.run_number }}
          body: |
            여행·대회·캠핑 준비물 앱 안드로이드 빌드입니다.

            **설치 방법**
            1. 아래 `supplies-v${{ github.run_number }}-debug.apk` 를 안드로이드 폰에서 다운로드합니다.
            2. 설치 시 "출처를 알 수 없는 앱 설치"를 허용하면 설치됩니다.

            (디버그 서명 APK입니다. 개인 사용/설치용으로 바로 쓸 수 있습니다.)
          files: out/supplies-v${{ github.run_number }}-debug.apk
          make_latest: true
